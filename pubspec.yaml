name: setube
description: "Setube para Android: convierte videos de YouTube a audio y video en el teléfono, sin servidor."
publish_to: 'none'
version: 1.2.1+13

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  lucide_icons_flutter: ^4.0.3
  material_ui: ^1.11.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Las versiones nuevas de estos dos plugins llaman a Java por JNI y en algunos teléfonos fallan con
# "ClassNotFoundException: Landroid/content/Context;". Estas son las últimas con canal clásico.
dependency_overrides:
  path_provider_android: 2.2.23
  shared_preferences_android: 2.4.28

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf
    - family: Plex
      fonts:
        - asset: assets/fonts/IBMPlexSans.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
